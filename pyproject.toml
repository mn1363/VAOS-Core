[project]
name = "vaos"
version = "0.1.0"
description = "VAOS -- Phase 1: Core layer"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "asyncpg>=0.30,<0.31",
    "qdrant-client>=1.9,<1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
src = ["src"]
